version: "2"

sql:
  - engine: postgresql
    schema: database/migration
    queries: database/query
    gen:
      go:
        package: sqlc
        out: database/sqlc
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
